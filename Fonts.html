<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sekuya&display=swap" rel="stylesheet">

    <style>

        .font-1{
            font-family: "Times New Roman", serif;
        }

        .font-2{
            font-family: "Arial", sans-serif;
        }

        .font-3{
            font-family: "Monaco", monospace;
        }


        .font-4{
            font-family: "Lucida Handwriting", cursive;
        }


        .font-5{
            font-family: "papyrus", fantasy;
        }

        .font-6{
            font-family: "Sekuya", system-ui;
            font-weight: 400;
            font-style: normal;
        }

    </style>
</head>
<body>

    <h1 class="font-1">This is Font 1</h1>
    <h1 class="font-2">This is Font 2</h1>
    <h1 class="font-3">This is Font 3</h1>
    <h1 class="font-4">This is Font 4</h1>
    <h1 class="font-5">This is Font 5</h1>
    <h1 class="font-6">This is Font 6</h1>
    
</body>
</html>
