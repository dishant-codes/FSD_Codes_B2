<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>


    <script>

        function checkUsername(uname){
            return new Promise((resolve, reject)=>{

            let username = uname;
            
            setTimeout(()=>{
                    if(username  === "upgrad.user01"){
                        resolve("Success");
                    }else{
                        reject("Not Found");
                    }
            },3000)
          
        })
        }


        async function handleLogin(){
                const result = await checkUsername("upgrad.user01");
                console.log(result);     
            }
            
            
        handleLogin();
        console.log("Waiting...");


        

    </script>
    
</body>
</html>
