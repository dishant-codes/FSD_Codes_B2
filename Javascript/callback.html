<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>


    <script>
        
        function displayer(val){
            document.write("Your Value is :"+val);
        }


        function myHandler(callback){
            alert("Hello Guys");
            let data = "Dishant";
            callback(data);
        }


        myHandler(displayer);

    </script>
