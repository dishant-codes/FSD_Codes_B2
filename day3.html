<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>


    <form action="/register" method="post">

        <fieldset>
            <legend>
                Hackathon Registration Form
            </legend>   
            
            <input type="text" placeholder="Enter your Name" required>

            <br>
            <br>

            <select required>
                <option disabled selected>Select Course</option>
                <option>FSD</option>
                <option>DS</option>
            </select>

            <br><br>

            <input type="date" required>

            <br><br>

            <input type="text" placeholder="Enter your Topic Name" required>

            <br><br>

            <input type="number" placeholder="Enter your Experience" required>

            <br><br>

            <select>
                <option>+91</option>
                <option>+90</option>
            </select>

            <input type="text" placeholder="enter mob no." maxlength="10"  required>

            <br><br>
            
            <input type="email" placeholder="Enter email id" required>

            <br><br>

            <textarea placeholder="Enter location" required></textarea>

            <br><br>

            <button type="submit">Register</button>
        </fieldset>

    </form>


   
    
</body>
</html>
