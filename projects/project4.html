<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .card-1{
            width: 400px;
            /* filter: blur(5px); */
            position: relative;
            overflow: hidden;
        }

        .card-1::after{
            content: '';
            width: 100%;
            height: 100%;
            position: absolute;
            left: 0%;
            backdrop-filter: saturate(0);
            background-image: url(../spider.jpg);
            background-size: cover;
            opacity: 0.2;
            transition: all 0.4s;
        }


        .wrapper:hover .card-1::after{
             transform: translateX(100%);
        }

    </style>
</head>
<body>


    <div class="wrapper">
    <div class="card-1">
            <img src="../space.jpg" width="100%" height="100%" alt="">
        </div>
    </div>
   
    
</body>
</html>
