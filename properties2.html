<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>


    <style>

        h1{
            /* text-align: center; */
            color: red;
            display: inline;
            font-size: 3rem;
            text-decoration: underline;
            padding-top: 20px;
            padding-bottom: 40px;
            padding-left: 60px;
            margin-top: 50px;
            border: 5px solid blue;
            width: 600px;
        }

        p{
            text-indent: 100px;
            word-spacing: 20px;
            line-height: 50px;
            letter-spacing: 5px;
        }


        p::first-letter{
            font-size: 40px;
            color: red;
        }


        img{
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
</head>
<body>
    
    <h1>This is Heading</h1>
    <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Amet quis atque debitis est, ea harum iure dolore deserunt accusamus consequuntur omnis porro ad labore, eligendi qui accusantium aliquam at illum!</p>


    <img src="spider.jpg" width="200px" alt="">
</body>
</html>
