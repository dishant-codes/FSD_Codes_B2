<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        
        .box-1, .box-2, .box-3, .box-4{
            position: absolute;
            width: 300px;
            height: 300px;
            border: 5px solid black;
        }

        .box-1{
            background-color: red;
            left: 30%;
            top: 10%;
            z-index: 5;
        }

        .box-2{
            background-color: orange;
            left: 60%;
            top: 30%;
            z-index: 3;
        }

        .box-3{
            background-color: green;
            left: 20%;
            top: 25%;
            z-index: 1;
        }

        .box-4{
            background-color: blue;
            z-index: 4;
        }
    </style>
</head>
<body>

    <div class="box-1"></div>
    <div class="box-2"></div>
    <div class="box-3"></div>
    <div class="box-4"></div>
    
</body>
</html>
